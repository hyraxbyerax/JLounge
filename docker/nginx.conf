# 로컬 다중 서버 확인용 로드밸런서 (AWS ALB 역할). docker compose --profile multi up
# 요청·연결마다 server-a / server-b 중 아무 데나 고른다 (고정 세션 없음). 같은 방 사람들이 서로 다른 서버에
# 붙어도 Redis 어댑터로 채팅이 오가야 한다. (번갈아 고르면 "로그인 요청 → 소켓" 순서 때문에 소켓이 한쪽에만 몰린다)
upstream lounge_servers {
  random;
  server server-a:3000;
  server server-b:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;

  location / {
    proxy_pass http://lounge_servers;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 어느 서버가 답했는지 브라우저 개발자 도구에서 볼 수 있게
    add_header X-Upstream $upstream_addr always;
    proxy_read_timeout 1h;
  }
}
