# 로컬 개발용 Valkey(Redis 호환)·PostgreSQL. 값은 .env 에서 읽는다.
#   docker compose up -d
#
# 다중 서버 확인 (AWS에서 서버가 여러 대일 때를 흉내 낸다):
#   npm run dev 를 끄고 →  docker compose --profile multi up --build  →  npm run dev:web
#   서버 2대(server-a, server-b) + 로드밸런서(nginx)가 3000번 포트에서 뜬다. 화면은 그대로 http://localhost:5173

x-server: &server
  build: .
  profiles: [multi]
  env_file: .env
  environment: &server-env # 컨테이너 안에서는 서비스 이름으로 접속한다 (.env 의 localhost 주소 대신)
    REDIS_URL: redis://valkey:6379
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    PORT: '3000'
    TRUST_PROXY: 'true'
    LOG_LEVEL: debug
  depends_on:
    valkey:
      condition: service_healthy
    postgres:
      condition: service_healthy
  healthcheck:
    test:
      ['CMD', 'node', '-e', "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  server-a:
    <<: *server
    environment:
      <<: *server-env
      INSTANCE_NAME: server-a

  server-b:
    <<: *server
    environment:
      <<: *server-env
      INSTANCE_NAME: server-b

  lb:
    image: nginx:1.27
    profiles: [multi]
    ports:
      # 개발 서버(npm run dev)와 함께 띄우려면 LB_PORT 를 바꾸고 화면을 API_PROXY_TARGET 으로 그쪽에 붙인다
      - '127.0.0.1:${LB_PORT:-3000}:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server-a:
        condition: service_healthy
      server-b:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8
    ports:
      # 내 컴퓨터 안에서만 열기 (같은 와이파이의 다른 기기는 접속 못 하게)
      - '127.0.0.1:${VALKEY_PORT:-6379}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER를 설정해주세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정해주세요}
      POSTGRES_DB: ${POSTGRES_DB:?.env에 POSTGRES_DB를 설정해주세요}
    ports:
      # Windows는 5336~5835 포트를 예약해 둘 때가 있어서 컴퓨터 쪽 포트 기본값을 15432로 둔다
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      # PostgreSQL 18 이미지는 /var/lib/postgresql 아래에 버전별 폴더를 만든다
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  valkey-data:
  postgres-data:
